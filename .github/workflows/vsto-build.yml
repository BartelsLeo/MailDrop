# Übersetzt das VSTO-Add-in (Debug) auf einem Windows-Runner - reine Compile-Prüfung, damit
# Fehler auffallen, bevor jemand in Visual Studio baut. Kein Publish, keine Artefakte.
# Die abschließende VSTO-Signaturprüfung scheitert auf dem Runner immer (siehe Build-Schritt) und
# wird ausgewertet; für die vorgelagerte Manifest-Signatur reicht ein Wegwerf-Zertifikat.
name: vsto-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.vb"
      - "**/*.xaml"
      - "**/*.xml"
      - "MailDrop.vbproj"
      - "MailDrop.sln"
      - "packages.config"
      - "app.config"
      - ".github/workflows/vsto-build.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - name: NuGet-Pakete (packages.config)
        run: nuget restore MailDrop.sln

      - name: Office-/VSTO-Werkzeuge vorhanden?
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "Visual Studio: $vs"
          Get-ChildItem -Recurse -Filter Microsoft.VisualStudio.Tools.Office.targets -Path "$vs\MSBuild" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Targets: $($_.FullName)" }

      # Ohne Zertifikat im Speicher bricht der Build schon vorher ab (MSB3323, Lauf 3). Ein
      # Wegwerf-Zertifikat genügt; das echte MailDrop_1_TemporaryKey.pfx liegt nie im Repo.
      - name: Wegwerf-Zertifikat für die Manifest-Signatur
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=MailDrop CI" -Type CodeSigningCert -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # Voller Build (nur das Ziel Compile reicht nicht: dann fehlt die XAML-Markup-Kompilierung,
      # und alle in XAML deklarierten Controls gelten als unbekannt - Lauf 2, 2026-09-29).
      # Auf dem Runner scheitert danach zwingend der VSTO-Schritt VerifyClickOnceSigningSettings
      # (MSB4018, Microsoft.VisualStudio.Tools.Applications.Hosting fehlt) - Lauf 1. Deshalb gilt:
      # grün, wenn MailDrop.dll entstanden ist und es außer genau diesem Fehler keinen gibt.
      # Signatur/Manifeste prüft nur ein echter Build/Publish in Visual Studio.
      - name: Build (Debug) und Auswertung
        shell: pwsh
        run: |
          msbuild MailDrop.vbproj /p:Configuration=Debug /p:Platform=AnyCPU /p:ManifestCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} /p:ManifestKeyFile= /v:minimal /nologo 2>&1 | Tee-Object -Variable out
          # Bekannter Runner-Fehler: alle MSB4018-Zeilen aus Microsoft.VisualStudio.Tools.Office.targets(162,...)
          $unexpected = $out | Where-Object { "$_" -match ': error ' -and "$_" -notmatch 'Office\.targets\(162,\d+\): error MSB4018' }
          if ($unexpected) { Write-Host "Unerwartete Fehler:"; $unexpected | ForEach-Object { Write-Host $_ }; exit 1 }
          if (-not (Test-Path bin\Debug\MailDrop.dll)) { Write-Host "MailDrop.dll wurde nicht erzeugt."; exit 1 }
          Write-Host "MailDrop.dll kompiliert ohne Code-Fehler (bekannter Runner-Fehler der VSTO-Signaturprüfung ignoriert)."
          exit 0

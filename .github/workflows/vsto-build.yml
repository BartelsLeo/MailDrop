# Übersetzt das VSTO-Add-in (Debug) auf einem Windows-Runner - reine Compile-Prüfung, damit
# Fehler auffallen, bevor jemand in Visual Studio baut. Kein Publish, keine Artefakte.
# Nur das MSBuild-Ziel Compile (keine ClickOnce-Manifeste/Signatur), daher braucht es weder
# das echte MailDrop_1_TemporaryKey.pfx noch ein Ersatzzertifikat.
name: vsto-build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.vb"
      - "**/*.xaml"
      - "**/*.xml"
      - "MailDrop.vbproj"
      - "MailDrop.sln"
      - "packages.config"
      - "app.config"
      - ".github/workflows/vsto-build.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      - name: NuGet-Pakete (packages.config)
        run: nuget restore MailDrop.sln

      - name: Office-/VSTO-Werkzeuge vorhanden?
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "Visual Studio: $vs"
          Get-ChildItem -Recurse -Filter Microsoft.VisualStudio.Tools.Office.targets -Path "$vs\MSBuild" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Targets: $($_.FullName)" }

      # Nur das Compile-Ziel: der anschließende VSTO-Schritt VerifyClickOnceSigningSettings braucht
      # Microsoft.VisualStudio.Tools.Applications.Hosting, das auf dem Runner fehlt (erster Lauf
      # 2026-09-29: MailDrop.dll wurde gebaut, danach MSB4018). Signatur/Manifeste prüft nur ein
      # echter Publish in Visual Studio.
      - name: Compile (Debug)
        run: msbuild MailDrop.vbproj /t:Compile /p:Configuration=Debug /p:Platform=AnyCPU /v:minimal /nologo
